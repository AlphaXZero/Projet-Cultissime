@startuml
skinparam backgroundColor transparent
skinparam shadowing false
skinparam objectBorderColor #6e1423
skinparam objectBackgroundColor #faf5f5
skinparam databaseBorderColor #6e1423
skinparam databaseBackgroundColor #faf5f5
skinparam ArrowColor #6e1423
left to right direction

title Soumettre une question — collaboration système

object "Utilisateur authentifié" as A
object ":Système" as S

A -[#6e1423]-> S : 1: ouvrirFormulaireQuestion()
S -[#6e1423]-> A : 2: afficherFormulaire()
A -[#6e1423]-> S : 3: remplirQuestion(énoncé, réponses)
S -[#6e1423]-> A : 4: afficherCatégoriesSuggérées()
A -[#6e1423]-> S : 5: soumettreQuestion()
S -[#6e1423]-> A : 6: confirmationSoumission()
@enduml

