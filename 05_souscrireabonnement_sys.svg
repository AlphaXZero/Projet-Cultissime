: 1.0;"/><polygon fill="#6E1423" points="745.97,108.9431,736.97,104.9431,740.97,108.9431,736.97,112.9431,745.97,108.9431" style="stroke: #6E1423; stroke-width: 1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="208" x="507" y="105.01">4: demanderPaiement(montant)</text><!--link X to S--><path d="M763.17,125.9931 C747.8,129.2931 731.41,132.2531 716,133.9431 C623.22,144.1331 597.74,151.1031 506,133.9431 C497.79,132.4131 489.28,129.8631 481.23,126.9731 " fill="none" id="X-S" style="stroke: #6E1423; stroke-width: 1.0;"/><polygon fill="#6E1423" points="476.29,125.1231,483.3309,132.0097,480.9763,126.8662,486.1199,124.5116,476.29,125.1231" style="stroke: #6E1423; stroke-width: 1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="145" x="538.5" y="130.01">5: paiementConfirmé()</text><!--
@startuml
skinparam backgroundColor transparent
skinparam shadowing false
skinparam objectBorderColor #6e1423
skinparam objectBackgroundColor #faf5f5
skinparam databaseBorderColor #6e1423
skinparam databaseBackgroundColor #faf5f5
skinparam ArrowColor #6e1423
left to right direction

title Souscrire un abonnement — collaboration système

object "Utilisateur authentifié" as A
object ":Système" as S
object "Prestataire de paiement" as X

A -[#6e1423]-> S : 1: sélectionnerAbonnement()
S -[#6e1423]-> A : 2: afficherRécapitulatif()
A -[#6e1423]-> S : 3: confirmerPaiement(infos)
S -[#6e1423]-> X : 4: demanderPaiement(montant)
X -[#6e1423]-> S : 5: paiementConfirmé()
S -[#6e1423]-> A : 6: abonnementActivé()
@enduml

