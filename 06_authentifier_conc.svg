@startuml
skinparam backgroundColor transparent
skinparam shadowing false
skinparam objectBorderColor #6e1423
skinparam objectBackgroundColor #faf5f5
skinparam databaseBorderColor #6e1423
skinparam databaseBackgroundColor #faf5f5
skinparam ArrowColor #6e1423
left to right direction

title S'authentifier — collaboration de conception

object "Utilisateur" as A
object ":IHMConnexion" as IHM
object ":CtrlAuthentification" as C
object "joueur:Joueur" as E
object ":BaseDeDonnées" as BD

A -[#6e1423]-> IHM : 1: demanderConnexion()
IHM -[#6e1423]-> A : 2: afficherFormulaire()
A -[#6e1423]-> IHM : 3: soumettreIdentifiants(login, mdp)
IHM -[#6e1423]-> C : 4: authentifier(login, mdp)
C -[#6e1423]-> BD : 5: trouverParLogin(login)
C -[#6e1423]-> E : 6: créer(données)
C -[#6e1423]-> E : 7: vérifierMotDePasse(mdp)
C -[#6e1423]-> IHM : 8: sessionOuverte(joueur)
IHM -[#6e1423]-> A : 9: afficherEspaceUtilisateur()
@enduml

