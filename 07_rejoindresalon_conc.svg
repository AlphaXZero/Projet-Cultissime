@startuml
skinparam backgroundColor transparent
skinparam shadowing false
skinparam objectBorderColor #6e1423
skinparam objectBackgroundColor #faf5f5
skinparam databaseBorderColor #6e1423
skinparam databaseBackgroundColor #faf5f5
skinparam ArrowColor #6e1423
left to right direction

title Rejoindre un salon — collaboration de conception

object "Joueur" as A
object ":IHMSalon" as IHM
object ":CtrlSalon" as C
object "salon:Salon" as E
object ":BaseDeDonnées" as BD

A -[#6e1423]-> IHM : 1: consulterSalonsPublics()
IHM -[#6e1423]-> C : 2: listerSalons()
C -[#6e1423]-> BD : 3: chargerSalonsOuverts()
C -[#6e1423]-> IHM : 4: listeSalons
IHM -[#6e1423]-> A : 5: afficherListe(salons)
A -[#6e1423]-> IHM : 6: rejoindreSalon(idSalon)
IHM -[#6e1423]-> C : 7: rejoindreSalon(idSalon, idJoueur)
C -[#6e1423]-> E : 8: vérifierDisponibilité()
C -[#6e1423]-> E : 9: ajouterJoueur(idJoueur)
C -[#6e1423]-> IHM : 10: salonRejoint(état)
IHM -[#6e1423]-> A : 11: afficherSalon(état)
@enduml

