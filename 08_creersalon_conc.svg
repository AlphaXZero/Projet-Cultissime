just="spacingAndGlyphs" textLength="147" x="818.5" y="92.6">5: créer(config, idHôte)</text><!--link C to BD--><path d="M778.03,136.6131 C787.59,140.2031 798.03,143.5331 808,145.5331 C872.7,158.5531 948.33,159.5731 1000.91,158.0931 " fill="none" id="C-BD" style="stroke: #6E1423; stroke-width: 1.0;"/><polygon fill="#6E1423" points="1005.92,157.9431,996.7988,154.2278,1000.9225,158.1002,997.0501,162.2239,1005.92,157.9431" style="stroke: #6E1423; stroke-width: 1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="166" x="809" y="141.6">6: enregistrerSalon(salon)</text><!--
@startuml
skinparam backgroundColor transparent
skinparam shadowing false
skinparam objectBorderColor #6e1423
skinparam objectBackgroundColor #faf5f5
skinparam databaseBorderColor #6e1423
skinparam databaseBackgroundColor #faf5f5
skinparam ArrowColor #6e1423
left to right direction

title Créer un salon — collaboration de conception

object "Joueur" as A
object ":IHMSalon" as IHM
object ":CtrlSalon" as C
object "salon:Salon" as E
object ":BaseDeDonnées" as BD

A -[#6e1423]-> IHM : 1: créerSalon()
IHM -[#6e1423]-> A : 2: afficherOptionsConfiguration()
A -[#6e1423]-> IHM : 3: configurerPartie(pack, mode, cotation)
IHM -[#6e1423]-> C : 4: créerSalon(config, idHôte)
C -[#6e1423]-> E : 5: créer(config, idHôte)
C -[#6e1423]-> BD : 6: enregistrerSalon(salon)
C -[#6e1423]-> IHM : 7: salonOuvert(lien)
IHM -[#6e1423]-> A : 8: afficherSalon(lien)
@enduml

