@startuml
skinparam backgroundColor transparent
skinparam shadowing false
skinparam objectBorderColor #6e1423
skinparam objectBackgroundColor #faf5f5
skinparam databaseBorderColor #6e1423
skinparam databaseBackgroundColor #faf5f5
skinparam ArrowColor #6e1423
left to right direction

title Soumettre une question — collaboration de conception

object "Utilisateur authentifié" as A
object ":IHMQuestion" as IHM
object ":CtrlContenu" as C
object "question:Question" as E
object ":BaseDeDonnées" as BD

A -[#6e1423]-> IHM : 1: ouvrirFormulaireQuestion()
IHM -[#6e1423]-> A : 2: afficherFormulaire()
A -[#6e1423]-> IHM : 3: remplirQuestion(énoncé, réponses)
IHM -[#6e1423]-> C : 4: suggérerCatégories(énoncé)
C -[#6e1423]-> IHM : 5: tagsSuggérés
IHM -[#6e1423]-> A : 6: afficherCatégories(tags)
A -[#6e1423]-> IHM : 7: soumettreQuestion(données)
IHM -[#6e1423]-> C : 8: soumettreQuestion(données)
C -[#6e1423]-> E : 9: créer(données)
C -[#6e1423]-> BD : 10: enregistrerQuestion()
C -[#6e1423]-> IHM : 11: confirmationSoumission()
IHM -[#6e1423]-> A : 12: afficherConfirmation()
@enduml

