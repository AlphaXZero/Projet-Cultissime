@startuml
skinparam backgroundColor transparent
skinparam shadowing false
skinparam objectBorderColor #6e1423
skinparam objectBackgroundColor #faf5f5
skinparam ArrowColor #6e1423
left to right direction
title Soumettre une question — collaboration de conception (E1 : champ manquant)


object "Utilisateur authentifié" as A
object ":IHMQuestion" as IHM
object ":CtrlContenu" as C

A -[#6e1423]-> IHM : 1: soumettreQuestion(donnéesIncomplètes)
IHM -[#6e1423]-> C : 2: soumettreQuestion(données)
C -[#6e1423]-> C : 3: validerChamps(données)
C -[#6e1423]-> IHM : 4: champsManquants(liste)
IHM -[#6e1423]-> A : 5: indiquerChampsÀCompléter(liste)
@enduml

