@startuml
skinparam backgroundColor transparent
skinparam shadowing false
skinparam objectBorderColor #6e1423
skinparam objectBackgroundColor #faf5f5
skinparam databaseBorderColor #6e1423
skinparam databaseBackgroundColor #faf5f5
skinparam ArrowColor #6e1423
left to right direction

title Souscrire un abonnement — collaboration de conception

object "Utilisateur authentifié" as A
object ":IHMAbonnement" as IHM
object ":CtrlAbonnement" as C
object "abonnement:Abonnement" as E
object ":BaseDeDonnées" as BD
object "Prestataire de paiement" as P

A -[#6e1423]-> IHM : 1: sélectionnerAbonnement()
IHM -[#6e1423]-> A : 2: afficherRécapitulatif()
A -[#6e1423]-> IHM : 3: confirmerPaiement(infos)
IHM -[#6e1423]-> C : 4: souscrire(idJoueur, infos)
C -[#6e1423]-> P : 5: demanderPaiement(montant)
P -[#6e1423]-> C : 6: paiementConfirmé()
C -[#6e1423]-> E : 7: créer(idJoueur, date)
C -[#6e1423]-> BD : 8: enregistrerAbonnement()
C -[#6e1423]-> IHM : 9: abonnementActivé()
IHM -[#6e1423]-> A : 10: afficherConfirmation()
@enduml

