@startuml
title Diagramme de packages — Projet Cultissime

skinparam backgroundColor transparent
skinparam shadowing false
skinparam package {
  BackgroundColor #faf5f5
  BorderColor #6e1423
}
skinparam class {
  BackgroundColor #ffffff
  BorderColor #6e1423
}
skinparam ArrowColor #6e1423
hide circle
hide members

package "Comptes" {
  class Joueur
  class Invité
  class Membre
  class Abonnement
}

package "Jeu" {
  class Salon
  class Partie
  class Participation
}

package "Contenu" {
  class Pack
  class Question
  class Réponse
  class Média
  class Tag
  class Vote
}

Jeu ..> Comptes : <<use>>
Jeu ..> Contenu : <<use>>
Contenu ..> Comptes : <<use>>
@enduml

