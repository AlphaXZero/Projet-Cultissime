" lengthAdjust="spacingAndGlyphs" textLength="35" x="565" y="434.4908">valide</text><polygon fill="#6E1423" points="341,468.0058,331,472.0058,341,476.0058,337,472.0058" style="stroke: #6E1423; stroke-width: 1.0;"/><line style="stroke: #6E1423; stroke-width: 1.0; stroke-dasharray: 2.0,2.0;" x1="335" x2="542" y1="472.0058" y2="472.0058"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="140" x="347" y="466.1968">sessionOuverte(joueur)</text><polygon fill="#6E1423" points="57,499.7118,47,503.7118,57,507.7118,53,503.7118" style="stroke: #6E1423; stroke-width: 1.0;"/><line style="stroke: #6E1423; stroke-width: 1.0; stroke-dasharray: 2.0,2.0;" x1="51" x2="324" y1="503.7118" y2="503.7118"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="155" x="63" y="497.9028">afficherEspaceUtilisateur()</text><!--MD5=[70e664bf16aa7d5dd37a0a012a2a2c33]
@startuml
title S'authentifier — séquence de conception (nominal)
skinparam backgroundColor transparent
skinparam shadowing false
skinparam sequenceArrowColor #6e1423
skinparam sequenceLifeLineBorderColor #6e1423
skinparam sequenceParticipantBorderColor #6e1423
skinparam sequenceParticipantBackgroundColor #faf5f5
skinparam actorBorderColor #333333

actor "Utilisateur" as U
boundary ":IHMConnexion" as IHM
control ":CtrlAuthentification" as C
entity "joueur:Joueur" as J
database ":BaseDeDonnées" as BD

U -> IHM : demanderConnexion()
activate IHM
IHM - -> U : afficherFormulaire()

U -> IHM : soumettreIdentifiants(login, motDePasse)
IHM -> C : authentifier(login, motDePasse)
activate C
C -> BD : trouverParLogin(login)
activate BD
BD - -> C : donnéesJoueur
deactivate BD
create J
C -> J : <<create>> créer(donnéesJoueur)
C -> J : vérifierMotDePasse(motDePasse)
activate J
J - -> C : valide
deactivate J
C - -> IHM : sessionOuverte(joueur)
deactivate C
IHM - -> U : afficherEspaceUtilisateur()
deactivate IHM
@enduml

