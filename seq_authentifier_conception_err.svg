t-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="186" x="593" y="318.4575">aucun objet Joueur n'est créé</text><polygon fill="#6E1423" points="352,348.6563,342,352.6563,352,356.6563,348,352.6563" style="stroke: #6E1423; stroke-width: 1.0;"/><line style="stroke: #6E1423; stroke-width: 1.0; stroke-dasharray: 2.0,2.0;" x1="346" x2="576" y1="352.6563" y2="352.6563"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="207" x="358" y="347.5903">échecAuthentification(message)</text><polygon fill="#6E1423" points="56,377.7891,46,381.7891,56,385.7891,52,381.7891" style="stroke: #6E1423; stroke-width: 1.0;"/><line style="stroke: #6E1423; stroke-width: 1.0; stroke-dasharray: 2.0,2.0;" x1="50" x2="335" y1="381.7891" y2="381.7891"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="193" x="62" y="376.7231">afficherErreurEtRécupération()</text><!--
@startuml
title S'authentifier — séquence de conception (E1 : identifiants incorrects)
skinparam backgroundColor transparent
skinparam shadowing false
skinparam sequenceArrowColor #6e1423
skinparam sequenceLifeLineBorderColor #6e1423
skinparam sequenceParticipantBorderColor #6e1423
skinparam sequenceParticipantBackgroundColor #faf5f5
skinparam actorBorderColor #333333

actor "Utilisateur" as U
boundary ":IHMConnexion" as IHM
control ":CtrlAuthentification" as C
database ":BaseDeDonnées" as BD

U -> IHM : soumettreIdentifiants(login, motDePasse)
activate IHM
IHM -> C : authentifier(login, motDePasse)
activate C
C -> BD : trouverParLogin(login)
activate BD
BD - -> C : donnéesJoueur
deactivate BD
C -> C : vérifierMotDePasse(mdp)
note right of C : mot de passe invalide :\naucun objet Joueur n'est créé
C - -> IHM : échecAuthentification(message)
deactivate C
IHM - -> U : afficherErreurEtRécupération()
deactivate IHM

@enduml

