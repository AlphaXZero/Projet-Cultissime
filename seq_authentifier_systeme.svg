stroke: #6E1423; stroke-width: 1.0;" x1="326" x2="367" y1="265.4078" y2="265.4078"/><polygon fill="#6E1423" points="336,261.4078,326,265.4078,336,269.4078,332,265.4078" style="stroke: #6E1423; stroke-width: 1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="117" x="332" y="246.5988">vérifierIdentifiants()</text><polygon fill="#6E1423" points="57,293.1138,47,297.1138,57,301.1138,53,297.1138" style="stroke: #6E1423; stroke-width: 1.0;"/><line style="stroke: #6E1423; stroke-width: 1.0; stroke-dasharray: 2.0,2.0;" x1="51" x2="319" y1="297.1138" y2="297.1138"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="204" x="63" y="291.3048">sessionOuverte(espaceUtilisateur)</text><!--MD5=[4927b92620563288452dda442d1fda29]
@startuml
title S'authentifier — séquence système (nominal)
skinparam backgroundColor transparent
skinparam shadowing false
skinparam sequenceArrowColor #6e1423
skinparam sequenceLifeLineBorderColor #6e1423
skinparam sequenceParticipantBorderColor #6e1423
skinparam sequenceParticipantBackgroundColor #faf5f5
skinparam actorBorderColor #333333

actor "Utilisateur" as U
participant "Système" as S

U -> S : demanderConnexion()
activate S
S - -> U : afficherFormulaire()
deactivate S

U -> S : soumettreIdentifiants(login, motDePasse)
activate S
S -> S : vérifierIdentifiants()
S - -> U : sessionOuverte(espaceUtilisateur)
deactivate S
@enduml

