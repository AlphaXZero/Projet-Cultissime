.9263">échecAuthentification(message)</text><path d="M72,227.9922 L72,267.9922 L258,267.9922 L258,237.9922 L248,227.9922 L72,227.9922 " fill="#FBFB77" style="stroke: #A80036; stroke-width: 1.0;"/><path d="M248,227.9922 L248,237.9922 L258,237.9922 L248,227.9922 " fill="#FBFB77" style="stroke: #A80036; stroke-width: 1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="165" x="78" y="245.0591">après plusieurs tentatives</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="94" x="78" y="260.1919">infructueuses :</text><polygon fill="#6E1423" points="341,290.3906,351,294.3906,341,298.3906,345,294.3906" style="stroke: #6E1423; stroke-width: 1.0;"/><line style="stroke: #6E1423; stroke-width: 1.0;" x1="67" x2="347" y1="294.3906" y2="294.3906"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="242" x="74" y="289.3247">nouvelleTentative(login, motDePasse)</text><polygon fill="#6E1423" points="78,319.5234,68,323.5234,78,327.5234,74,323.5234" style="stroke: #6E1423; stroke-width: 1.0;"/><line style="stroke: #6E1423; stroke-width: 1.0; stroke-dasharray: 2.0,2.0;" x1="72" x2="357" y1="323.5234" y2="323.5234"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="231" x="84" y="318.4575">proposerRécupérationMotDePasse()</text><!--
@startuml
title S'authentifier — séquence système (E1 : identifiants incorrects)
skinparam backgroundColor transparent
skinparam shadowing false
skinparam sequenceArrowColor #6e1423
skinparam sequenceLifeLineBorderColor #6e1423
skinparam sequenceParticipantBorderColor #6e1423
skinparam sequenceParticipantBackgroundColor #faf5f5
skinparam actorBorderColor #333333

actor "Utilisateur" as U
participant "Système" as S

U -> S : soumettreIdentifiants(login, motDePasse)
activate S
S -> S : vérifierIdentifiants()
S - -> U : échecAuthentification(message)
deactivate S
note right of U : après plusieurs tentatives\ninfructueuses :
U -> S : nouvelleTentative(login, motDePasse)
activate S
S - -> U : proposerRécupérationMotDePasse()
deactivate S

@enduml

