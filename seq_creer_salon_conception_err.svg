 x2="232" y1="143.7266" y2="143.7266"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="186" x="40" y="138.6606">configurerPartie(paramètres)</text><polygon fill="#6E1423" points="467,168.8594,477,172.8594,467,176.8594,471,172.8594" style="stroke: #6E1423; stroke-width: 1.0;"/><line style="stroke: #6E1423; stroke-width: 1.0;" x1="248" x2="473" y1="172.8594" y2="172.8594"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="212" x="255" y="167.7935">créerSalon(configuration, idHôte)</text><line style="stroke: #6E1423; stroke-width: 1.0;" x1="489" x2="531" y1="201.9922" y2="201.9922"/><line style="stroke: #6E1423; stroke-width: 1.0;" x1="531" x2="531" y1="201.9922" y2="214.9922"/><line style="stroke: #6E1423; stroke-width: 1.0;" x1="490" x2="531" y1="214.9922" y2="214.9922"/><polygon fill="#6E1423" points="500,210.9922,490,214.9922,500,218.9922,496,214.9922" style="stroke: #6E1423; stroke-width: 1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="205" x="496" y="196.9263">vérifierCohérence(configuration)</text><path d="M494,227.9922 L494,282.9922 L691,282.9922 L691,237.9922 L681,227.9922 L494,227.9922 " fill="#FBFB77" style="stroke: #A80036; stroke-width: 1.0;"/><path d="M681,227.9922 L681,237.9922 L691,237.9922 L681,227.9922 " fill="#FBFB77" style="stroke: #A80036; stroke-width: 1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="145" x="500" y="245.0591">paramètres en conflit :</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="176" x="500" y="260.1919">l'objet Salon n'est pas créé,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="128" x="500" y="275.3247">rien n'est enregistré</text><polygon fill="#6E1423" points="259,305.5234,249,309.5234,259,313.5234,255,309.5234" style="stroke: #6E1423; stroke-width: 1.0;"/><line style="stroke: #6E1423; stroke-width: 1.0; stroke-dasharray: 2.0,2.0;" x1="253" x2="483" y1="309.5234" y2="309.5234"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="183" x="265" y="304.4575">paramètresEnConflit(détails)</text><polygon fill="#6E1423" points="44,334.6563,34,338.6563,44,342.6563,40,338.6563" style="stroke: #6E1423; stroke-width: 1.0;"/><line style="stroke: #6E1423; stroke-width: 1.0; stroke-dasharray: 2.0,2.0;" x1="38" x2="242" y1="338.6563" y2="338.6563"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="142" x="50" y="333.5903">signalerConflit(détails)</text><!--
@startuml
title Créer un salon — séquence de conception (E2 : configuration incohérente)
skinparam backgroundColor transparent
skinparam shadowing false
skinparam sequenceArrowColor #6e1423
skinparam sequenceLifeLineBorderColor #6e1423
skinparam sequenceParticipantBorderColor #6e1423
skinparam sequenceParticipantBackgroundColor #faf5f5
skinparam actorBorderColor #333333

actor "Joueur" as J
boundary ":IHMSalon" as IHM
control ":CtrlSalon" as C

J -> IHM : configurerPartie(paramètres)
activate IHM
IHM -> C : créerSalon(configuration, idHôte)
activate C
C -> C : vérifierCohérence(configuration)
note right of C : paramètres en conflit :\nl'objet Salon n'est pas créé,\nrien n'est enregistré
C - -> IHM : paramètresEnConflit(détails)
deactivate C
IHM - -> J : signalerConflit(détails)
deactivate IHM

@enduml

