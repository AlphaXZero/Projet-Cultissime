1,243.7018 L651,243.7018 L641,233.7018 " fill="#FBFB77" style="stroke: #A80036; stroke-width: 1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="171" x="465" y="252.5988">inclut « Configurer la partie »</text><line style="stroke: #6E1423; stroke-width: 1.0;" x1="454" x2="496" y1="290.1138" y2="290.1138"/><line style="stroke: #6E1423; stroke-width: 1.0;" x1="496" x2="496" y1="290.1138" y2="303.1138"/><line style="stroke: #6E1423; stroke-width: 1.0;" x1="455" x2="496" y1="303.1138" y2="303.1138"/><polygon fill="#6E1423" points="465,299.1138,455,303.1138,465,307.1138,461,303.1138" style="stroke: #6E1423; stroke-width: 1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="188" x="461" y="284.3048">enregistrerSalon(configuration)</text><polygon fill="#6E1423" points="44,330.8199,34,334.8199,44,338.8199,40,334.8199" style="stroke: #6E1423; stroke-width: 1.0;"/><line style="stroke: #6E1423; stroke-width: 1.0; stroke-dasharray: 2.0,2.0;" x1="38" x2="448" y1="334.8199" y2="334.8199"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="150" x="50" y="329.0109">salonOuvert(lienPartage)</text><!--MD5=[7cbca44c82f14ec7156eb91627e80e20]
@startuml
title Créer un salon — séquence système (nominal)
skinparam backgroundColor transparent
skinparam shadowing false
skinparam sequenceArrowColor #6e1423
skinparam sequenceLifeLineBorderColor #6e1423
skinparam sequenceParticipantBorderColor #6e1423
skinparam sequenceParticipantBackgroundColor #faf5f5
skinparam actorBorderColor #333333

actor "Joueur" as J
participant "Système" as S

J -> S : créerSalon()
activate S
S - -> J : afficherOptionsConfiguration()
deactivate S

J -> S : configurerPartie(pack, mode, cotation, visibilité, conditionVictoire)
activate S
note right of S : inclut « Configurer la partie »
S -> S : enregistrerSalon(configuration)
S - -> J : salonOuvert(lienPartage)
deactivate S
@enduml

