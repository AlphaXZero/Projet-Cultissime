EnConflit(détails)</text><polygon fill="#6E1423" points="279,240.125,289,244.125,279,248.125,283,244.125" style="stroke: #6E1423; stroke-width: 1.0;"/><line style="stroke: #6E1423; stroke-width: 1.0;" x1="33" x2="285" y1="244.125" y2="244.125"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="239" x="40" y="239.0591">configurerPartie(paramètresCorrigés)</text><line style="stroke: #6E1423; stroke-width: 1.0;" x1="301" x2="343" y1="273.2578" y2="273.2578"/><line style="stroke: #6E1423; stroke-width: 1.0;" x1="343" x2="343" y1="273.2578" y2="286.2578"/><line style="stroke: #6E1423; stroke-width: 1.0;" x1="302" x2="343" y1="286.2578" y2="286.2578"/><polygon fill="#6E1423" points="312,282.2578,302,286.2578,312,290.2578,308,286.2578" style="stroke: #6E1423; stroke-width: 1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="250" x="308" y="268.1919">vérifierCohérence(paramètresCorrigés)</text><polygon fill="#6E1423" points="44,311.3906,34,315.3906,44,319.3906,40,315.3906" style="stroke: #6E1423; stroke-width: 1.0;"/><line style="stroke: #6E1423; stroke-width: 1.0; stroke-dasharray: 2.0,2.0;" x1="38" x2="295" y1="315.3906" y2="315.3906"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="159" x="50" y="310.3247">salonOuvert(lienPartage)</text><!--
@startuml
title Créer un salon — séquence système (E2 : configuration incohérente)
skinparam backgroundColor transparent
skinparam shadowing false
skinparam sequenceArrowColor #6e1423
skinparam sequenceLifeLineBorderColor #6e1423
skinparam sequenceParticipantBorderColor #6e1423
skinparam sequenceParticipantBackgroundColor #faf5f5
skinparam actorBorderColor #333333

actor "Joueur" as J
participant "Système" as S

J -> S : configurerPartie(paramètres)
activate S
S -> S : vérifierCohérence(paramètres)
S - -> J : paramètresEnConflit(détails)
deactivate S
J -> S : configurerPartie(paramètresCorrigés)
activate S
S -> S : vérifierCohérence(paramètresCorrigés)
S - -> J : salonOuvert(lienPartage)
deactivate S

@enduml

