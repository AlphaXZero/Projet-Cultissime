 y1="201.9922" y2="214.9922"/><line style="stroke: #6E1423; stroke-width: 1.0;" x1="633" x2="674" y1="214.9922" y2="214.9922"/><polygon fill="#6E1423" points="643,210.9922,633,214.9922,643,218.9922,639,214.9922" style="stroke: #6E1423; stroke-width: 1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="157" x="639" y="196.9263">échéanceChronomètre()</text><polygon fill="#6E1423" points="224,240.125,234,244.125,224,248.125,228,244.125" style="stroke: #6E1423; stroke-width: 1.0;"/><line style="stroke: #6E1423; stroke-width: 1.0;" x1="33" x2="230" y1="244.125" y2="244.125"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="184" x="40" y="239.0591">soumettreRéponse(réponse)</text><line style="stroke: #6E1423; stroke-width: 2.0;" x1="604" x2="614" y1="268.2578" y2="278.2578"/><line style="stroke: #6E1423; stroke-width: 2.0;" x1="604" x2="614" y1="278.2578" y2="268.2578"/><line style="stroke: #6E1423; stroke-width: 1.0;" x1="241" x2="609" y1="273.2578" y2="273.2578"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="352" x="248" y="268.1919">&lt;&lt;dérobant&gt;&gt; enregistrerRéponse(idJoueur, réponse)</text><path d="M246,286.2578 L246,326.2578 L441,326.2578 L441,296.2578 L431,286.2578 L246,286.2578 " fill="#FBFB77" style="stroke: #A80036; stroke-width: 1.0;"/><path d="M431,286.2578 L431,296.2578 L441,296.2578 L431,286.2578 " fill="#FBFB77" style="stroke: #A80036; stroke-width: 1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="139" x="252" y="303.3247">la question est close :</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="174" x="252" y="318.4575">le message est abandonné</text><polygon fill="#6E1423" points="899,348.6563,909,352.6563,899,356.6563,903,352.6563" style="stroke: #6E1423; stroke-width: 1.0;"/><line style="stroke: #6E1423; stroke-width: 1.0;" x1="632" x2="905" y1="352.6563" y2="352.6563"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="260" x="639" y="347.5903">clôturerQuestion(sansRéponse, idJoueur)</text><polygon fill="#6E1423" points="643,377.7891,633,381.7891,643,385.7891,639,381.7891" style="stroke: #6E1423; stroke-width: 1.0;"/><line style="stroke: #6E1423; stroke-width: 1.0; stroke-dasharray: 2.0,2.0;" x1="637" x2="915" y1="381.7891" y2="381.7891"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="60" x="649" y="376.7231">zéroPoint</text><line style="stroke: #6E1423; stroke-width: 1.0;" x1="241" x2="251" y1="410.9219" y2="406.9219"/><line style="stroke: #6E1423; stroke-width: 1.0;" x1="241" x2="251" y1="410.9219" y2="414.9219"/><line style="stroke: #6E1423; stroke-width: 1.0;" x1="241" x2="621" y1="410.9219" y2="410.9219"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="241" x="258" y="405.856">afficherRésultat(nonRépondu, 0 point)</text><line style="stroke: #6E1423; stroke-width: 1.0;" x1="241" x2="251" y1="440.0547" y2="436.0547"/><line style="stroke: #6E1423; stroke-width: 1.0;" x1="241" x2="251" y1="440.0547" y2="444.0547"/><line style="stroke: #6E1423; stroke-width: 1.0;" x1="241" x2="626" y1="440.0547" y2="440.0547"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="207" x="258" y="434.9888">afficherClassement(classement)</text><!--
@startuml
title Jouer une partie — séquence de conception (E3 : temps écoulé sans réponse)
skinparam backgroundColor transparent
skinparam shadowing false
skinparam sequenceArrowColor #6e1423
skinparam sequenceLifeLineBorderColor #6e1423
skinparam sequenceParticipantBorderColor #6e1423
skinparam sequenceParticipantBackgroundColor #faf5f5
skinparam actorBorderColor #333333

actor "Joueur" as J
boundary ":IHMJeu" as IHM
control ":CtrlPartie" as C
entity "partie:Partie" as P

C ->> IHM : <<minuté>> afficherQuestion(question, tempsImparti)
activate C
IHM ->> J : afficherQuestion(question)
C -> C : échéanceChronomètre()
J -> IHM : soumettreRéponse(réponse)
activate IHM
IHM ->x C : <<dérobant>> enregistrerRéponse(idJoueur, réponse)
note right of IHM : la question est close :\nle message est abandonné
deactivate IHM
C -> P : clôturerQuestion(sansRéponse, idJoueur)
activate P
P - -> C : zéroPoint
deactivate P
C ->> IHM : afficherRésultat(nonRépondu, 0 point)
C ->> IHM : afficherClassement(classement)
deactivate C

@enduml

