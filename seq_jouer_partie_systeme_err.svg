922 L598,237.9922 L588,227.9922 L423,227.9922 " fill="#FBFB77" style="stroke: #A80036; stroke-width: 1.0;"/><path d="M588,227.9922 L588,237.9922 L598,237.9922 L588,227.9922 " fill="#FBFB77" style="stroke: #A80036; stroke-width: 1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="147" x="429" y="245.0591">la réponse arrive après</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="154" x="429" y="260.1919">l'échéance : le message</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="96" x="429" y="275.3247">est abandonné</text><line style="stroke: #6E1423; stroke-width: 1.0;" x1="33" x2="43" y1="309.5234" y2="305.5234"/><line style="stroke: #6E1423; stroke-width: 1.0;" x1="33" x2="43" y1="309.5234" y2="313.5234"/><line style="stroke: #6E1423; stroke-width: 1.0;" x1="33" x2="407" y1="309.5234" y2="309.5234"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="199" x="50" y="304.4575">questionNonRépondue(0 point)</text><line style="stroke: #6E1423; stroke-width: 1.0;" x1="33" x2="43" y1="338.6563" y2="334.6563"/><line style="stroke: #6E1423; stroke-width: 1.0;" x1="33" x2="43" y1="338.6563" y2="342.6563"/><line style="stroke: #6E1423; stroke-width: 1.0;" x1="33" x2="412" y1="338.6563" y2="338.6563"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="207" x="50" y="333.5903">afficherClassement(classement)</text><!--
@startuml
title Jouer une partie — séquence système (E3 : temps écoulé sans réponse)
skinparam backgroundColor transparent
skinparam shadowing false
skinparam sequenceArrowColor #6e1423
skinparam sequenceLifeLineBorderColor #6e1423
skinparam sequenceParticipantBorderColor #6e1423
skinparam sequenceParticipantBackgroundColor #faf5f5
skinparam actorBorderColor #333333

actor "Joueur" as J
participant "Système" as S

S ->> J : <<minuté>> afficherQuestion(question, tempsImparti)
activate S
S -> S : échéanceChronomètre()
J ->x S : <<dérobant>> soumettreRéponse(réponse)
note right of S : la réponse arrive après\nl'échéance : le message\nest abandonné
S ->> J : questionNonRépondue(0 point)
S ->> J : afficherClassement(classement)
deactivate S

@enduml

