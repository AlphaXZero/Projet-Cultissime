00" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="123" x="442" y="405.1289">vérifierDisponibilité()</text><polygon fill="#6E1423" points="446,438.6439,436,442.6439,446,446.6439,442,442.6439" style="stroke: #6E1423; stroke-width: 1.0;"/><line style="stroke: #6E1423; stroke-width: 1.0; stroke-dasharray: 2.0,2.0;" x1="440" x2="600" y1="442.6439" y2="442.6439"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="94" x="452" y="436.8349">placeDisponible</text><polygon fill="#6E1423" points="589,470.3499,599,474.3499,589,478.3499,593,474.3499" style="stroke: #6E1423; stroke-width: 1.0;"/><line style="stroke: #6E1423; stroke-width: 1.0;" x1="435" x2="595" y1="474.3499" y2="474.3499"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="142" x="442" y="468.5409">ajouterJoueur(idJoueur)</text><polygon fill="#6E1423" points="221,502.056,211,506.056,221,510.056,217,506.056" style="stroke: #6E1423; stroke-width: 1.0;"/><line style="stroke: #6E1423; stroke-width: 1.0; stroke-dasharray: 2.0,2.0;" x1="215" x2="429" y1="506.056" y2="506.056"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="139" x="227" y="500.247">salonRejoint(étatSalon)</text><polygon fill="#6E1423" points="44,533.762,34,537.762,44,541.762,40,537.762" style="stroke: #6E1423; stroke-width: 1.0;"/><line style="stroke: #6E1423; stroke-width: 1.0; stroke-dasharray: 2.0,2.0;" x1="38" x2="204" y1="537.762" y2="537.762"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="142" x="50" y="531.953">afficherSalon(étatSalon)</text><!--MD5=[76e27a7d721b36833e1d166966383f3a]
@startuml
title Rejoindre un salon — séquence de conception (nominal)
skinparam backgroundColor transparent
skinparam shadowing false
skinparam sequenceArrowColor #6e1423
skinparam sequenceLifeLineBorderColor #6e1423
skinparam sequenceParticipantBorderColor #6e1423
skinparam sequenceParticipantBackgroundColor #faf5f5
skinparam actorBorderColor #333333

actor "Joueur" as J
boundary ":IHMSalon" as IHM
control ":CtrlSalon" as C
entity "salon:Salon" as S
database ":BaseDeDonnées" as BD

J -> IHM : consulterSalonsPublics()
activate IHM
IHM -> C : listerSalons()
activate C
C -> BD : chargerSalonsOuverts()
activate BD
BD - -> C : listeSalons
deactivate BD
C - -> IHM : listeSalons
deactivate C
IHM - -> J : afficherListe(listeSalons)

J -> IHM : rejoindreSalon(idSalon)
IHM -> C : rejoindreSalon(idSalon, idJoueur)
activate C
C -> S : vérifierDisponibilité()
activate S
S - -> C : placeDisponible
deactivate S
C -> S : ajouterJoueur(idJoueur)
C - -> IHM : salonRejoint(étatSalon)
deactivate C
IHM - -> J : afficherSalon(étatSalon)
deactivate IHM
@enduml

