631,260.2578" style="stroke: #6E1423; stroke-width: 1.0;"/><line style="stroke: #6E1423; stroke-width: 1.0;" x1="474" x2="633" y1="260.2578" y2="260.2578"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="130" x="481" y="255.1919">vérifierDisponibilité()</text><polygon fill="#6E1423" points="485,285.3906,475,289.3906,485,293.3906,481,289.3906" style="stroke: #6E1423; stroke-width: 1.0;"/><line style="stroke: #6E1423; stroke-width: 1.0; stroke-dasharray: 2.0,2.0;" x1="479" x2="643" y1="289.3906" y2="289.3906"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="100" x="491" y="284.3247">placeDisponible</text><polygon fill="#6E1423" points="632,314.5234,642,318.5234,632,322.5234,636,318.5234" style="stroke: #6E1423; stroke-width: 1.0;"/><line style="stroke: #6E1423; stroke-width: 1.0;" x1="474" x2="638" y1="318.5234" y2="318.5234"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="146" x="481" y="313.4575">ajouterJoueur(idJoueur)</text><polygon fill="#6E1423" points="233,343.6563,223,347.6563,233,351.6563,229,347.6563" style="stroke: #6E1423; stroke-width: 1.0;"/><line style="stroke: #6E1423; stroke-width: 1.0; stroke-dasharray: 2.0,2.0;" x1="227" x2="468" y1="347.6563" y2="347.6563"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="149" x="239" y="342.5903">salonRejoint(étatSalon)</text><polygon fill="#6E1423" points="44,372.7891,34,376.7891,44,380.7891,40,376.7891" style="stroke: #6E1423; stroke-width: 1.0;"/><line style="stroke: #6E1423; stroke-width: 1.0; stroke-dasharray: 2.0,2.0;" x1="38" x2="216" y1="376.7891" y2="376.7891"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="155" x="50" y="371.7231">afficherSalon(étatSalon)</text><!--
@startuml
title Rejoindre un salon — séquence de conception (A1 : salon privé)
skinparam backgroundColor transparent
skinparam shadowing false
skinparam sequenceArrowColor #6e1423
skinparam sequenceLifeLineBorderColor #6e1423
skinparam sequenceParticipantBorderColor #6e1423
skinparam sequenceParticipantBackgroundColor #faf5f5
skinparam actorBorderColor #333333

actor "Joueur" as J
boundary ":IHMSalon" as IHM
control ":CtrlSalon" as C
entity "salon:Salon" as S
database ":BaseDeDonnées" as BD

J -> IHM : saisirCodeAccès(code)
activate IHM
IHM -> C : rejoindreSalonPrivé(code, idJoueur)
activate C
C -> BD : trouverSalonParCode(code)
activate BD
BD - -> C : salon
deactivate BD
C -> S : vérifierDisponibilité()
activate S
S - -> C : placeDisponible
deactivate S
C -> S : ajouterJoueur(idJoueur)
C - -> IHM : salonRejoint(étatSalon)
deactivate C
IHM - -> J : afficherSalon(étatSalon)
deactivate IHM

@enduml

