8,261.125,94,257.125" style="stroke: #6E1423; stroke-width: 1.0;"/><line style="stroke: #6E1423; stroke-width: 1.0; stroke-dasharray: 2.0,2.0;" x1="92" x2="274" y1="257.125" y2="257.125"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="149" x="104" y="252.0591">salonRejoint(étatSalon)</text><!--
@startuml
title Rejoindre un salon — séquence système (A1 : salon privé)
skinparam backgroundColor transparent
skinparam shadowing false
skinparam sequenceArrowColor #6e1423
skinparam sequenceLifeLineBorderColor #6e1423
skinparam sequenceParticipantBorderColor #6e1423
skinparam sequenceParticipantBackgroundColor #faf5f5
skinparam actorBorderColor #333333

actor "Joueur" as J
participant "Système" as S

J -> S : rejoindreSalonPrivé(code)
activate S
S -> S : validerCode(code)
S -> S : vérifierDisponibilité()
S - -> J : salonRejoint(étatSalon)
deactivate S

@enduml

