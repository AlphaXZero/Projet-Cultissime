; stroke-width: 1.0;" width="10" x="333.5" y="160.0234"/><rect fill="#FFFFFF" height="136.6641" style="stroke: #6E1423; stroke-width: 1.0;" width="10" x="551.5" y="189.1563"/><polygon fill="#6E1423" points="321.5,156.0234,331.5,160.0234,321.5,164.0234,325.5,160.0234" style="stroke: #6E1423; stroke-width: 1.0;"/><line style="stroke: #6E1423; stroke-width: 1.0;" x1="47.5" x2="327.5" y1="160.0234" y2="160.0234"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="267" x="54.5" y="154.9575">soumettreQuestion(donnéesIncomplètes)</text><polygon fill="#6E1423" points="539.5,185.1563,549.5,189.1563,539.5,193.1563,543.5,189.1563" style="stroke: #6E1423; stroke-width: 1.0;"/><line style="stroke: #6E1423; stroke-width: 1.0;" x1="343.5" x2="545.5" y1="189.1563" y2="189.1563"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="189" x="350.5" y="184.0903">soumettreQuestion(données)</text><line style="stroke: #6E1423; stroke-width: 1.0;" x1="561.5" x2="603.5" y1="218.2891" y2="218.2891"/><line style="stroke: #6E1423; stroke-width: 1.0;" x1="603.5" x2="603.5" y1="218.2891" y2="231.2891"/><line style="stroke: #6E1423; stroke-width: 1.0;" x1="562.5" x2="603.5" y1="231.2891" y2="231.2891"/><polygon fill="#6E1423" points="572.5,227.2891,562.5,231.2891,572.5,235.2891,568.5,231.2891" style="stroke: #6E1423; stroke-width: 1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="160" x="568.5" y="213.2231">validerChamps(données)</text><path d="M566,244.2891 L566,299.2891 L788,299.2891 L788,254.2891 L778,244.2891 L566,244.2891 " fill="#FBFB77" style="stroke: #A80036; stroke-width: 1.0;"/><path d="M778,244.2891 L778,254.2891 L788,254.2891 L778,244.2891 " fill="#FBFB77" style="stroke: #A80036; stroke-width: 1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="201" x="572" y="261.356">champ manquant : aucun objet</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="177" x="572" y="276.4888">Question créé, aucun accès</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="137" x="572" y="291.6216">à la base de données</text><polygon fill="#6E1423" points="354.5,321.8203,344.5,325.8203,354.5,329.8203,350.5,325.8203" style="stroke: #6E1423; stroke-width: 1.0;"/><line style="stroke: #6E1423; stroke-width: 1.0; stroke-dasharray: 2.0,2.0;" x1="348.5" x2="555.5" y1="325.8203" y2="325.8203"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="158" x="360.5" y="320.7544">champsManquants(liste)</text><polygon fill="#6E1423" points="58.5,350.9531,48.5,354.9531,58.5,358.9531,54.5,354.9531" style="stroke: #6E1423; stroke-width: 1.0;"/><line style="stroke: #6E1423; stroke-width: 1.0; stroke-dasharray: 2.0,2.0;" x1="52.5" x2="337.5" y1="354.9531" y2="354.9531"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="216" x="64.5" y="349.8872">indiquerChampsÀCompléter(liste)</text><!--
@startuml
title Soumettre une question — séquence de conception (E1 : champ obligatoire manquant)
skinparam backgroundColor transparent
skinparam shadowing false
skinparam sequenceArrowColor #6e1423
skinparam sequenceLifeLineBorderColor #6e1423
skinparam sequenceParticipantBorderColor #6e1423
skinparam sequenceParticipantBackgroundColor #faf5f5
skinparam actorBorderColor #333333

actor "Utilisateur\nauthentifié" as U
boundary ":IHMQuestion" as IHM
control ":CtrlContenu" as C

U -> IHM : soumettreQuestion(donnéesIncomplètes)
activate IHM
IHM -> C : soumettreQuestion(données)
activate C
C -> C : validerChamps(données)
note right of C : champ manquant : aucun objet\nQuestion créé, aucun accès\nà la base de données
C - -> IHM : champsManquants(liste)
deactivate C
IHM - -> U : indiquerChampsÀCompléter(liste)
deactivate IHM

@enduml

