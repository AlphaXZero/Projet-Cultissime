,313,239.7697" style="stroke: #6E1423; stroke-width: 1.0;"/><line style="stroke: #6E1423; stroke-width: 1.0;" x1="48" x2="315" y1="239.7697" y2="239.7697"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="254" x="55" y="233.9607">remplirQuestion(énoncé, réponses, média)</text><line style="stroke: #6E1423; stroke-width: 1.0;" x1="331" x2="373" y1="271.4757" y2="271.4757"/><line style="stroke: #6E1423; stroke-width: 1.0;" x1="373" x2="373" y1="271.4757" y2="284.4757"/><line style="stroke: #6E1423; stroke-width: 1.0;" x1="332" x2="373" y1="284.4757" y2="284.4757"/><polygon fill="#6E1423" points="342,280.4757,332,284.4757,342,288.4757,338,284.4757" style="stroke: #6E1423; stroke-width: 1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="126" x="338" y="265.6667">suggérerCatégories()</text><polygon fill="#6E1423" points="59,312.1818,49,316.1818,59,320.1818,55,316.1818" style="stroke: #6E1423; stroke-width: 1.0;"/><line style="stroke: #6E1423; stroke-width: 1.0; stroke-dasharray: 2.0,2.0;" x1="53" x2="325" y1="316.1818" y2="316.1818"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="205" x="65" y="310.3728">afficherCatégoriesSuggérées(tags)</text><polygon fill="#6E1423" points="309,343.8878,319,347.8878,309,351.8878,313,347.8878" style="stroke: #6E1423; stroke-width: 1.0;"/><line style="stroke: #6E1423; stroke-width: 1.0;" x1="48" x2="315" y1="347.8878" y2="347.8878"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="211" x="55" y="342.0788">soumettreQuestion(question, tags)</text><line style="stroke: #6E1423; stroke-width: 1.0;" x1="331" x2="373" y1="379.5938" y2="379.5938"/><line style="stroke: #6E1423; stroke-width: 1.0;" x1="373" x2="373" y1="379.5938" y2="392.5938"/><line style="stroke: #6E1423; stroke-width: 1.0;" x1="332" x2="373" y1="392.5938" y2="392.5938"/><polygon fill="#6E1423" points="342,388.5938,332,392.5938,342,396.5938,338,392.5938" style="stroke: #6E1423; stroke-width: 1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="195" x="338" y="373.7848">enregistrer(statut = "en attente")</text><polygon fill="#6E1423" points="59,420.2998,49,424.2998,59,428.2998,55,424.2998" style="stroke: #6E1423; stroke-width: 1.0;"/><line style="stroke: #6E1423; stroke-width: 1.0; stroke-dasharray: 2.0,2.0;" x1="53" x2="325" y1="424.2998" y2="424.2998"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="154" x="65" y="418.4908">confirmationSoumission()</text><!--MD5=[0edb5003371b10d7ecf2310194cbf4c7]
@startuml
title Soumettre une question — séquence système (nominal)
skinparam backgroundColor transparent
skinparam shadowing false
skinparam sequenceArrowColor #6e1423
skinparam sequenceLifeLineBorderColor #6e1423
skinparam sequenceParticipantBorderColor #6e1423
skinparam sequenceParticipantBackgroundColor #faf5f5
skinparam actorBorderColor #333333

actor "Utilisateur\nauthentifié" as U
participant "Système" as S

U -> S : ouvrirFormulaireQuestion()
activate S
S - -> U : afficherFormulaire()
deactivate S

U -> S : remplirQuestion(énoncé, réponses, média)
activate S
S -> S : suggérerCatégories()
S - -> U : afficherCatégoriesSuggérées(tags)
deactivate S

U -> S : soumettreQuestion(question, tags)
activate S
S -> S : enregistrer(statut = "en attente")
S - -> U : confirmationSoumission()
deactivate S
@enduml

