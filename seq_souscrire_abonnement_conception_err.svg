lyphs" textLength="142" x="316.5" y="321.7544">échecPaiement(motif)</text><polygon fill="#6E1423" points="58.5,351.9531,48.5,355.9531,58.5,359.9531,54.5,355.9531" style="stroke: #6E1423; stroke-width: 1.0;"/><line style="stroke: #6E1423; stroke-width: 1.0; stroke-dasharray: 2.0,2.0;" x1="52.5" x2="293.5" y1="355.9531" y2="355.9531"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="128" x="64.5" y="350.8872">afficherÉchec(motif)</text><!--
@startuml
title Souscrire un abonnement — séquence de conception (E1 : paiement refusé)
skinparam backgroundColor transparent
skinparam shadowing false
skinparam sequenceArrowColor #6e1423
skinparam sequenceLifeLineBorderColor #6e1423
skinparam sequenceParticipantBorderColor #6e1423
skinparam sequenceParticipantBackgroundColor #faf5f5
skinparam actorBorderColor #333333

actor "Utilisateur\nauthentifié" as U
boundary ":IHMAbonnement" as IHM
control ":CtrlAbonnement" as C
participant "Prestataire\nde paiement" as P

U -> IHM : confirmerPaiement(infosPaiement)
activate IHM
IHM -> C : souscrire(idJoueur, infosPaiement)
activate C
C -> P : demanderPaiement(montant, infosPaiement)
activate P
P - -> C : paiementRefusé(motif)
deactivate P
note right of C : aucun objet Abonnement créé,\nrien n'est enregistré
C - -> IHM : échecPaiement(motif)
deactivate C
IHM - -> U : afficherÉchec(motif)
deactivate IHM

@enduml

