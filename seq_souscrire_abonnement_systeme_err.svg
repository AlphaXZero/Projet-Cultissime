ngth="200" x="58" y="277.4888">l'abonnement n'est pas activé ;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="169" x="58" y="292.6216">l'utilisateur peut réessayer</text><!--
@startuml
title Souscrire un abonnement — séquence système (E1 : paiement refusé)
skinparam backgroundColor transparent
skinparam shadowing false
skinparam sequenceArrowColor #6e1423
skinparam sequenceLifeLineBorderColor #6e1423
skinparam sequenceParticipantBorderColor #6e1423
skinparam sequenceParticipantBackgroundColor #faf5f5
skinparam actorBorderColor #333333

actor "Utilisateur\nauthentifié" as U
participant "Système" as S
participant "Prestataire\nde paiement" as P

U -> S : confirmerPaiement(infosPaiement)
activate S
S -> P : demanderPaiement(montant, infosPaiement)
activate P
P - -> S : paiementRefusé(motif)
deactivate P
S - -> U : échecPaiement(motif)
deactivate S
note right of U : l'abonnement n'est pas activé ;\nl'utilisateur peut réessayer

@enduml

