ont-size="13" lengthAdjust="spacingAndGlyphs" textLength="98" x="307" y="70.9653">en modération.</text><!--link U to V--><path d="M68.51,667.87 C93.62,619.54 132.32,545.08 159.05,493.64 " fill="none" id="U-V" style="stroke: #6E1423; stroke-width: 1.0;"/><polygon fill="none" points="152.88,490.34,168.31,475.82,165.3,496.79,152.88,490.34" style="stroke: #6E1423; stroke-width: 1.0;"/><!--link V to UC_AUTH--><path d="M215.87,446.96 C237.46,456.22 269.68,469.47 298.5,479 C324.71,487.67 354.59,495.62 378.56,501.55 " fill="none" id="V-UC_AUTH" style="stroke: #6E1423; stroke-width: 1.0;"/><!--link V to UC_PWD--><path d="M215.81,467.76 C235.88,491.59 266.06,523.52 298.5,544 C318.34,556.53 342.22,566.06 363.76,572.99 " fill="none" id="V-UC_PWD" style="stroke: #6E1423; stroke-width: 1.0;"/><!--link V to UC_JOIN--><path d="M215.5,402.53 C235.3,377.75 265.27,344.96 298.5,325 C317.47,313.6 340.24,305.66 361.11,300.19 " fill="none" id="V-UC_JOIN" style="stroke: #6E1423; stroke-width: 1.0;"/><!--link V to UC_CREATE--><path d="M215.85,424.75 C237.41,415.24 269.63,401.67 298.5,392 C323.51,383.62 351.89,375.98 375.28,370.17 " fill="none" id="V-UC_CREATE" style="stroke: #6E1423; stroke-width: 1.0;"/><!--link V to UC_MANAGE--><path d="M215.88,436 C245.81,436 297.57,436 341.92,436 " fill="none" id="V-UC_MANAGE" style="stroke: #6E1423; stroke-width: 1.0;"/><!--link V to UC_PLAY--><path d="M193.7,396.23 C200.23,335.25 222.51,220.32 298.5,169 C439.86,73.53 661.49,153 743.81,188.26 " fill="none" id="V-UC_PLAY" style="stroke: #6E1423; stroke-width: 1.0;"/><!--link U to UC_PROFILE--><path d="M79.25,712.14 C137.17,705.89 253.23,693.37 334.51,684.6 " fill="none" id="U-UC_PROFILE" style="stroke: #6E1423; stroke-width: 1.0;"/><!--link U to UC_SUBMIT--><path d="M79.25,719.95 C137.73,726.41 255.45,739.43 336.83,748.42 " fill="none" id="U-UC_SUBMIT" style="stroke: #6E1423; stroke-width: 1.0;"/><!--link U to UC_SUB--><path d="M79.25,727.48 C144.93,748.56 285.37,793.65 365.08,819.24 " fill="none" id="U-UC_SUB" style="stroke: #6E1423; stroke-width: 1.0;"/><!--link A to UC_MOD--><path d="M240.02,920 C266.27,920 299.48,920 330.41,920 " fill="none" id="A-UC_MOD" style="stroke: #6E1423; stroke-width: 1.0;"/><!--link UC_CREATE to UC_CONFIG--><path d="M492.67,359 C549.51,359 631.24,359 692.33,359 " fill="none" id="UC_CREATE-UC_CONFIG" style="stroke: #6E1423; stroke-width: 1.0; stroke-dasharray: 7.0,7.0;"/><polygon fill="#6E1423" points="697.43,359,688.43,355,692.43,359,688.43,363,697.43,359" style="stroke: #6E1423; stroke-width: 1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="61" x="579" y="355.0669">«include»</text><!--link UC_RATE to UC_PLAY--><path d="M514.85,208.96 C572.42,207.65 646.42,205.96 700.94,204.71 " fill="none" id="UC_RATE-UC_PLAY" style="stroke: #6E1423; stroke-width: 1.0; stroke-dasharray: 7.0,7.0;"/><polygon fill="#6E1423" points="706.15,204.59,697.0609,200.7967,701.1513,204.7043,697.2438,208.7946,706.15,204.59" style="stroke: #6E1423; stroke-width: 1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="60" x="579.5" y="203.0669">«extend»</text><!--
@startuml

left to right direction

skinparam backgroundColor transparent
skinparam shadowing false
skinparam ArrowColor #6e1423
skinparam packageStyle rectangle
skinparam usecase {
  BackgroundColor #faf5f5
  BorderColor #6e1423
  ArrowColor #6e1423
}
skinparam actor {
  BorderColor #333333
  BackgroundColor #ffffff
}
skinparam note {
  BackgroundColor #fffbea
  BorderColor #6e1423
}

actor "Visiteur" as V
actor "Utilisateur\nauthentifié" as U
actor "Administrateur" as A

U - -|> V

rectangle "Projet Cultissime" {

  usecase "S'authentifier" as UC_AUTH
  usecase "Récupérer son\nmot de passe" as UC_PWD
  usecase "Rejoindre un salon" as UC_JOIN
  usecase "Créer un salon" as UC_CREATE
  usecase "Configurer la partie" as UC_CONFIG
  usecase "Gérer son salon\n(exclure, fermer)" as UC_MANAGE
  usecase "Jouer une partie" as UC_PLAY
  usecase "Noter une question\n(up / down)" as UC_RATE

  usecase "Consulter son profil\net ses statistiques" as UC_PROFILE
  usecase "Soumettre une question" as UC_SUBMIT
  usecase "Souscrire un abonnement" as UC_SUB

  usecase "Modérer les\nquestions soumises" as UC_MOD
}

V - - UC_AUTH
V - - UC_PWD
V - - UC_JOIN
V - - UC_CREATE
V - - UC_MANAGE
V - - UC_PLAY

U - - UC_PROFILE
U - - UC_SUBMIT
U - - UC_SUB

A - - UC_MOD

UC_CREATE ..> UC_CONFIG : <<include>>
UC_RATE ..> UC_PLAY : <<extend>>

note bottom of UC_PLAY
  L'accès en mode invité est
  possible : aucun compte n'est
  requis pour jouer.
end note

note bottom of UC_RATE
  Les votes alimentent le tri du
  contenu ; un taux de votes négatifs
  élevé renvoie la question
  en modération.
end note

@enduml

