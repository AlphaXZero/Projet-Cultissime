-serif" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="169" x="339.8093" y="762.4103">Soumettre une question</text><ellipse cx="424.2923" cy="837.7585" fill="#FAF5F5" rx="101.7923" ry="22.7585" style="stroke: #6E1423; stroke-width: 1.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="180" x="334.2923" y="842.4069">Souscrire un abonnement</text><ellipse cx="424.7287" cy="920.2392" fill="#FAF5F5" rx="94.2287" ry="24.2392" style="stroke: #6E1423; stroke-width: 1.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="82" x="383.7287" y="914.0627">Modérer les</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="140" x="354.7287" y="930.3595">questions soumises</text><!--entity V--><ellipse cx="190" cy="406.5" fill="#FFFFFF" rx="8" ry="8" style="stroke: #333333; stroke-width: 2.0;"/><path d="M190,414.5 L190,441.5 M177,422.5 L203,422.5 M190,441.5 L177,456.5 M190,441.5 L203,456.5 " fill="none" style="stroke: #333333; stroke-width: 2.0;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="51" x="164.5" y="472.4951">Visiteur</text><!--entity U--><ellipse cx="42.5" cy="678" fill="#FFFFFF" rx="8" ry="8" style="stroke: #333333; stroke-width: 2.0;"/><path d="M42.5,686 L42.5,713 M29.5,694 L55.5,694 M42.5,713 L29.5,728 M42.5,713 L55.5,728 " fill="none" style="stroke: #333333; stroke-width: 2.0;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="68" x="6" y="743.9951">Utilisateur</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="73" x="6" y="760.292">authentifié</text><!--entity A--><ellipse cx="190" cy="890.5" fill="#FFFFFF" rx="8" ry="8" style="stroke: #333333; stroke-width: 2.0;"/><path d="M190,898.5 L190,925.5 M177,906.5 L203,906.